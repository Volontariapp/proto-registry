name: Sync Protobuf to NPM
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check-proto-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'proto/**.proto' 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'proto/**.proto' 2>/dev/null || true)
          fi
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Proto files changed: $CHANGED"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No proto files changed. Skipping."
          fi

  lint:
    needs: check-proto-changes
    if: needs.check-proto-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @bufbuild/buf
      - run: buf lint

  sync:
    needs: [check-proto-changes, lint]
    if: >-
      github.event_name != 'pull_request' &&
      needs.check-proto-changes.outputs.has_changes == 'true'
    uses: Volontariapp/ci-tools/.github/workflows/sync-proto-npm.yml@main
    secrets: inherit
