syntax = "proto3";

package volontariapp.event.v1;

import "volontariapp/common/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

service EventService {
  rpc GetEvent (GetEventRequest) returns (GetEventResponse) {}
  rpc ListEvents (ListEventsRequest) returns (ListEventsResponse) {}
  rpc CreateEvent (CreateEventRequest) returns (CreateEventResponse) {}
  rpc UpdateEvent (UpdateEventRequest) returns (UpdateEventResponse) {}
  rpc DeleteEvent (DeleteEventRequest) returns (DeleteEventResponse) {}
}

message Event {
  string id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  string location = 6;
  string organizer_id = 7;
}

message GetEventRequest {
  string id = 1;
}

message GetEventResponse {
  Event event = 1;
}

message CreateEventResponse {
  Event event = 1;
}

message UpdateEventResponse {
  Event event = 1;
}

message ListEventsRequest {
  volontariapp.common.v1.PaginationRequest pagination = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
  volontariapp.common.v1.PaginationResponse pagination = 2;
}

message CreateEventRequest {
  string title = 1;
  string description = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  string location = 5;
  string organizer_id = 6;
}

message UpdateEventRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional google.protobuf.Timestamp start_date = 4;
  optional google.protobuf.Timestamp end_date = 5;
  optional string location = 6;
}

message DeleteEventRequest {
  string id = 1;
}

message DeleteEventResponse {
  bool success = 1;
}
