syntax = "proto3";

package volontariapp.event.v1;

import "volontariapp/common/v1/pagination.proto";
import "volontariapp/event/v1/event.proto";

message GetEventResponse {
  Event event = 1;
}

message CreateEventResponse {
  Event event = 1;
}

message UpdateEventResponse {
  Event event = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
  volontariapp.common.v1.PaginationResponse pagination = 2;
}

message DeleteEventResponse {
  bool success = 1;
}
