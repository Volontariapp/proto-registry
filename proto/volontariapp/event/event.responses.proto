syntax = "proto3";

package volontariapp.event;

import "volontariapp/event/event.proto";

message EventResponse {
  Event event = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
  int32 total_count = 2;
}

message RequirementListResponse {
  repeated Requirement requirements = 1;
}

message TagListResponse {
  repeated Tag tags = 1;
}

message ActionSuccessResponse {
  bool success = 1;
  string message = 2;
}
