syntax = "proto3";

package volontariapp.post.v1;

import "volontariapp/common/v1/pagination.proto";

message GetPostRequest {
  string id = 1;
}

message ListPostsRequest {
  volontariapp.common.v1.PaginationRequest pagination = 1;
  optional string author_id = 2;
}

message CreatePostRequest {
  string author_id = 1;
  string title = 2;
  string content = 3;
}

message UpdatePostRequest {
  string id = 1;
  optional string title = 2;
  optional string content = 3;
}

message DeletePostRequest {
  string id = 1;
}
